name: Feature request
description: Propose an operator, workflow, or interface improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the tool makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: >-
        What should happen instead? For a new mutation operator, describe the
        source pattern, the replacement, and the Typedtree evidence that keeps
        it type-safe (see docs/operators.md).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
