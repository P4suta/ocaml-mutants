name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    # Windows runner: the store-backed test suites only pass on Windows until
    # the POSIX Run_store/Dir_cap migration lands (docs/architecture.md).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Tag matches the dune-project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "(version $version)" dune-project
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3.7.1
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: python -m pip install --requirement requirements-dev.txt
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam install ocamlformat.0.28.1 -y
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest
      - run: opam exec -- dune build @dogfood-fast
      - run: opam exec -- dune build @fmt
      - run: opam exec -- dune build @doc
      - run: opam exec -- dune build @install
      - run: opam lint ocaml-mutants.opam
      - name: CLI reports the tagged version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(opam exec -- dune exec bin/main.exe -- --version)" = "$version"

  draft-release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "ocaml-mutants $GITHUB_REF_NAME" --generate-notes

# The draft stays unpublished on purpose: docs/release-checklist.md items that
# cannot run here (the complete Balanced self-dogfood, the pinned corpus gate,
# cross-OS acceptance, the opam-repository submission) remain manual.
