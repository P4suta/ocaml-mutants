name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Retry transient opam source downloads instead of failing the job.
env:
  OPAMRETRIES: "3"

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the dune-project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "(version $version)" dune-project
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: python -m pip install --requirement requirements-dev.txt
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam install ocamlformat.0.28.1 -y
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest
      - run: opam exec -- dune build @schema-validation
      - run: opam exec -- dune build @dogfood-fast
      - run: opam exec -- dune build @fmt
      - run: opam exec -- dune build @doc
      - run: opam exec -- dune build @install
      - run: opam lint ocaml-mutants.opam
      - name: CLI reports the tagged version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(opam exec -- dune exec bin/main.exe -- --version)" = "$version"

  draft-release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag
          --title "ocaml-mutants $GITHUB_REF_NAME" --generate-notes

# The draft stays unpublished on purpose: docs/release-checklist.md items that
# cannot run here (the complete Balanced self-dogfood, the pinned corpus gate,
# cross-OS acceptance, the opam-repository submission) remain manual.
