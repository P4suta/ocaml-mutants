name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          install_args: typos taplo actionlint committed
      - run: typos
      - run: >-
          taplo check mise.toml .ocaml-mutants.toml .typos.toml committed.toml
          scripts/corpus-v1.toml
      - run: actionlint
      - name: committed (pull request range)
        if: github.event_name == 'pull_request'
        run: committed ${{ github.event.pull_request.base.sha }}..HEAD
      - name: committed (pushed head)
        if: github.event_name != 'pull_request'
        run: committed HEAD~..HEAD

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        ocaml: ["5.4.1", "5.5.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3.7.1
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true
      - run: python -m pip install --requirement requirements-dev.txt
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam install ocamlformat.0.28.1 -y
      - run: opam exec -- dune build @all
      # The POSIX Run_store/Dir_cap substrate is a documented pre-release gate
      # (docs/architecture.md), so the store-backed suites can only pass on
      # Windows today. Re-enable the POSIX rows when the migration lands.
      - name: Tests (Windows only until the POSIX store lands)
        if: runner.os == 'Windows'
        run: opam exec -- dune runtest
      - name: Dogfood contracts (Windows only until the POSIX store lands)
        if: runner.os == 'Windows'
        run: opam exec -- dune build @dogfood-fast
      - run: opam exec -- dune build @fmt
      - run: opam exec -- dune build @doc
      - run: opam exec -- dune build @install
      - run: opam lint ocaml-mutants.opam

  dune-minimum:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3.7.1
        with:
          ocaml-compiler: "5.4.1"
          dune-cache: true
      - run: opam pin add dune 3.21.0 -y
      - run: python -m pip install --requirement requirements-dev.txt
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam install ocamlformat.0.28.1 -y
      - run: opam exec -- dune build @all @fmt @doc @install
      - run: opam exec -- dune runtest
      - run: opam exec -- dune build @dogfood-fast

  dogfood-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3.7.1
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - name: Deterministic self-catalog (twice, byte-identical)
        run: opam exec -- sh scripts/dogfood-list.sh

  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3.7.1
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: opam install . --deps-only --with-doc
      - run: opam install . --with-doc
      - run: opam exec -- ocaml-mutants --version
      - run: test -f "$(opam var share)/ocaml-mutants/run-report-v1.schema.json"
      - run: test -f "$(opam var share)/ocaml-mutants/catalog-v1.schema.json"
      - run: test -f "$(opam var share)/ocaml-mutants/mutation-testing-report-v2.schema.json"
      - run: test -f "$(opam var share)/ocaml-mutants/json-schema.md"
      - run: test -z "$(find "$(opam var lib)/ocaml-mutants" -name '*.cmi' -print -quit)"
