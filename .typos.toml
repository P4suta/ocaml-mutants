[files]
extend-exclude = ["_build", "_opam", "test/fixtures"]

[default.extend-words]
csexp = "csexp"
Typedtree = "Typedtree"

Tast = "Tast"
# OCaml bytecode object file extension.
cmo = "cmo"

[default.extend-identifiers]
# Verbatim constructor in OCaml's [open_flag] type.
Open_wronly = "Open_wronly"
# Verbatim Windows error-constant name; the misspelling is Microsoft's.
ERROR_FILENAME_EXCED_RANGE = "ERROR_FILENAME_EXCED_RANGE"
