name: mutation
on: [pull_request]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: "5.5.0" }
      - run: opam install .
      - run: ocaml-mutants plan --shards 4 --output plan.json
      - id: matrix
        run: echo 'value={"shard":[0,1,2,3]}' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: plan.json }
  run:
    needs: plan
    strategy: { matrix: ${{ fromJSON(needs.plan.outputs.matrix) }} }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: plan }
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: "5.5.0" }
      - run: opam install .
      - run: ocaml-mutants run --shard-plan plan.json --shard ${{ matrix.shard }} --quiet
      - run: ocaml-mutants report --format json --output shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with: { name: shard-${{ matrix.shard }}, path: shard-${{ matrix.shard }}.json }
  merge:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "*", merge-multiple: true }
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: "5.5.0" }
      - run: opam install .
      - run: ocaml-mutants merge plan.json shard-0.json shard-1.json shard-2.json shard-3.json
      - run: ocaml-mutants check
      - run: ocaml-mutants report --format html --format sarif --output artifacts
      - uses: actions/upload-artifact@v4
        with: { name: mutation-reports, path: artifacts }
