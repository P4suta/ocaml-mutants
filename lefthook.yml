pre-commit:
  parallel: true
  commands:
    format:
      run: opam exec -- dune build @fmt
    typos:
      run: typos
    toml:
      glob: "*.toml"
      run: taplo check {staged_files}
    workflows:
      glob: ".github/workflows/*.yml"
      run: actionlint

commit-msg:
  commands:
    committed:
      run: committed --commit-file {1}
